; Mitigações PHP2Shell (CVE-2026-109619): desliga o progresso de upload em sessão
session.upload_progress.enabled = 0

; Limita o tamanho do corpo aceito pelo PHP (reduz superfície do CVE-2026-109618)
post_max_size = 8M
upload_max_filesize = 8M

; Não expõe versão do PHP nos headers
expose_php = Off
