user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;

    # Must outlive the ALB idle timeout (60s), or the ALB reuses closed connections → 502.
    keepalive_timeout 75s;

    client_max_body_size 8m;

    # The load balancer is the client nginx sees; recover the real client IP from it.
    # Only private ranges are trusted, so a client hitting the task directly cannot spoof it.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # TLS ends at the load balancer; tell PHP the original request was HTTPS.
    map $http_x_forwarded_proto $fastcgi_https {
        default "";
        https   on;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout main;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    server {
        listen 8080 default_server;
        root /var/www/public;
        index index.php;

        # Checks nginx and PHP-FPM together, without booting Laravel.
        location = /health {
            access_log off;
            include fastcgi_params;
            fastcgi_param SCRIPT_NAME /fpm-ping;
            fastcgi_param SCRIPT_FILENAME /fpm-ping;
            fastcgi_param REQUEST_URI /fpm-ping;
            fastcgi_pass 127.0.0.1:9000;
        }

        location / {
            try_files $uri /index.php?$query_string;
        }

        # Only the front controller is executable; any other .php file is a 404.
        location = /index.php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_param HTTPS $fastcgi_https if_not_empty;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 60s;
        }

        location ~ \.php$ {
            return 404;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
