; Production pool. Values in ${...} come from the environment (defaults set in the Dockerfile).

[www]
user = www-data
group = www-data

; Only nginx, inside the same container, talks to FPM.
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = ${PHP_FPM_PM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_PM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_PM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_PM_MAX_SPARE_SERVERS}
pm.max_requests = ${PHP_FPM_PM_MAX_REQUESTS}

; Keep it aligned with the load balancer idle timeout (ALB default: 60s).
request_terminate_timeout = ${PHP_FPM_REQUEST_TERMINATE_TIMEOUT}

; Served by nginx at /health.
ping.path = /fpm-ping
ping.response = pong

; nginx already logs every request; FPM's access log would duplicate it.
access.log = /dev/null

; Worker output and PHP errors go to the container's stderr (CloudWatch, kubectl logs).
catch_workers_output = yes
decorate_workers_output = no
php_flag[display_errors] = off
php_admin_flag[log_errors] = on

; Task-definition env vars must reach PHP; FPM strips them by default.
clear_env = no
